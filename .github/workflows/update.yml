name: Update addons data
on:
    workflow_dispatch:
        inputs:
            Version:
                description: SA Version (with `v` prefix)
                required: false
                type: string
            Patch:
                required: false
                type: number
                default: 0
            Dryrun:
                required: false
                type: boolean
                default: false
    schedule:
        - cron: 30 11/12 * * *
    push:
        branches: main

permissions: {}

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

env:
    TITLE: 🚨 Typecheck Failed in CI

jobs:
    update:
        name: Update
        runs-on: ubuntu-24.04
        permissions:
            id-token: write # Required for OIDC
            issues: write # Required to create an issue

        steps:
            - name: Clone
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ScratchAddons/ScratchAddons
                  sparse-checkout: |
                      addons/*/addon.json
                      addons/addons.json
                      LICENSE
                      manifest.json
                  sparse-checkout-cone-mode: false
                  fetch-tags: true
                  fetch-depth: 0
                  persist-credentials: false

            - name: Get version
              run: |
                  VERSION=${version:-$(git describe --tags $(git rev-list --tags --max-count=1))}
                  echo "VERSION=$VERSION" >>"$GITHUB_ENV"
                  IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION#v}"
                  echo "PUBLISH_VERSION=$(printf "%d%03d.%s" "$MAJOR" "$MINOR" "$PATCH")" >>"$GITHUB_ENV"
              env:
                  version: ${{inputs.Version}}

            - name: Check version
              id: check_version
              if: ${{!inputs.Dryrun}}
              run: |
                  if [[ "$(npm view @sa-community/addons-data version)" == "$PUBLISH_VERSION."* && $PATCH == 0 ]]; then
                    echo "No new version"
                    echo "new_version=false" >>"$GITHUB_OUTPUT"
                  else
                    echo "New version found"
                    echo "new_version=true" >>"$GITHUB_OUTPUT"
                  fi
              env:
                  PATCH: ${{inputs.Patch||0}}

            - name: Checkout
              if: steps.check_version.outputs.new_version == 'true'
              run: git checkout "$VERSION"

            - name: Generate index.js
              run: |
                  echo "module.exports = [" >index.js
                  jq -r '.[] | select(type == "string" and startswith("//") | not) | "{addonId: \"\(.)\", manifest: require(\"./addons/\(.).js\")}"' addons/addons.json | sed 's/$/,/' >>index.js
                  echo "];" >>index.js

                  echo -e 'declare const _exports: { addonId: string; manifest: import("./addons.d.ts").AddonManifest; }[];\nexport = _exports;' >index.d.ts

                  rm addons/addons.json

            - name: Generate manifests
              run: |
                  find . -type f -name "addon.json" | while read -r json_file; do
                    dirname="$(dirname "$json_file")"

                    echo -e -n '/** @type {import("../addons.d.ts").AddonManifest} */\nconst addon = ' >"$dirname.js"
                    cat "$json_file" >>"$dirname.js"
                    echo -e -n ";\nmodule.exports = addon;" >>"$dirname.js"

                    echo -e 'declare const addon: import("../addons.d.ts").AddonManifest;\nexport = addon;' >"$dirname.d.ts"

                    rm -r "$dirname/"
                  done

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: script
                  persist-credentials: false

            - name: Move types
              run: mv script/addons.d.ts addons.d.ts

            - name: Move README
              run: mv script/README.md README.md

            - if: steps.check_version.outputs.new_version == 'true'
              run:
                  cat script/package.json | sed "s/VERSION/$PUBLISH_VERSION.${{inputs.Patch||0}}/"
                  >package.json

            - name: Setup Node.JS
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: script/package.json
                  registry-url: https://registry.npmjs.org

            - name: Publish
              if: steps.check_version.outputs.new_version == 'true'
              run: npm publish --access public --tag latest

            - name: Run typecheck
              id: typecheck
              run: |
                  echo "sha=$(git log -1 --pretty=format:%H)" >>"$GITHUB_OUTPUT"

                  cd script
                  npm ci
                  npx tsc ../index.js ../addons/**.js --allowJs --checkJs --noEmit --strict >typecheck.log || true
                  if [[ -s typecheck.log ]]; then
                    echo "has_errors=true" >>"$GITHUB_OUTPUT"
                    echo "LOG<<EOF" >>"$GITHUB_OUTPUT"
                    head -c 64000 typecheck.log >>"$GITHUB_OUTPUT"
                    echo "EOF" >>"$GITHUB_OUTPUT"
                  else
                    echo "has_errors=false" >>"$GITHUB_OUTPUT"
                  fi

            - name: Get existing issue
              id: issue
              run: |
                  echo "ISSUE=$(
                      gh issue list --json number -q ".[0].number" \
                      -R "$REPO" -A "github-actions[bot]" -S "\"$TITLE\""
                  )" >> $GITHUB_OUTPUT
              env:
                  GITHUB_TOKEN: ${{github.token}}
                  REPO: ${{github.repository}}

            - name: Create new issue
              if: steps.typecheck.outputs.has_errors == 'true' && steps.issue.outputs.ISSUE == ''
              run: gh issue create -t "$TITLE" -b "$BODY" -R "$REPO"
              env:
                  GITHUB_TOKEN: ${{github.token}}
                  REPO: ${{github.repository}}
                  BODY: |
                      https://github.com/ScratchAddons/ScratchAddons/tree/${{steps.typecheck.outputs.sha}}

                      ```
                      ${{steps.typecheck.outputs.LOG}}
                      ```

            - name: Comment on issue
              if: steps.typecheck.outputs.has_errors == 'true' && steps.issue.outputs.ISSUE != ''
              run: gh issue comment "$ISSUE" -b "$BODY" -R "$REPO"
              env:
                  ISSUE: ${{steps.issue.outputs.ISSUE}}
                  GITHUB_TOKEN: ${{github.token}}
                  REPO: ${{github.repository}}
                  BODY: |
                      https://github.com/ScratchAddons/ScratchAddons/tree/${{steps.typecheck.outputs.sha}}

                      ```
                      ${{steps.typecheck.outputs.LOG}}
                      ```

            - name: Close issue if typecheck passed
              if: steps.typecheck.outputs.has_errors == 'false' && steps.issue.outputs.ISSUE != ''
              run: gh issue close "$ISSUE" -R "$REPO"
              env:
                  ISSUE: ${{steps.issue.outputs.ISSUE}}
                  GITHUB_TOKEN: ${{github.token}}
                  REPO: ${{github.repository}}
